<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">grimoire skills — workflow and relationships</title>
  <desc id="desc">A code change flows left to right: code-polishing (content cleanup) runs first, then an optional language-style pass by python-code-review or cpp-code-review, then code-delivery (package and ship) runs last. session-handoff is a standalone skill, not part of the pipeline.</desc>

  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="490" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">grimoire skills — workflow &amp; relationships</text>
  <text x="490" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">A code change flows left to right through the pipeline; session-handoff stands on its own.</text>

  <!-- Stage 1: code-polishing -->
  <rect x="34" y="120" width="212" height="104" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="140" y="151" text-anchor="middle" font-size="15.5" font-weight="700" fill="#3730a3">code-polishing</text>
  <text x="140" y="174" text-anchor="middle" font-size="11" fill="#475569">content cleanup — runs first</text>
  <text x="140" y="192" text-anchor="middle" font-size="10.5" fill="#64748b">strip artifacts, dead code,</text>
  <text x="140" y="208" text-anchor="middle" font-size="10.5" fill="#64748b">stale docs, naming drift</text>

  <!-- arrow 1 -->
  <line x1="248" y1="172" x2="294" y2="172" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="294,172 285,167 285,177" fill="#64748b"/>
  <text x="271" y="164" text-anchor="middle" font-size="9.5" fill="#94a3b8">then</text>

  <!-- Stage 2: language style -->
  <text x="410" y="112" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">language style — optional, by language</text>
  <rect x="302" y="120" width="216" height="46" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="410" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">python-code-review</text>
  <rect x="302" y="178" width="216" height="46" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="410" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">cpp-code-review</text>

  <!-- arrow 2 -->
  <line x1="520" y1="172" x2="590" y2="172" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="590,172 581,167 581,177" fill="#64748b"/>
  <text x="555" y="164" text-anchor="middle" font-size="9.5" fill="#94a3b8">then ship</text>

  <!-- Stage 3: code-delivery -->
  <rect x="598" y="120" width="236" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="716" y="150" text-anchor="middle" font-size="15.5" font-weight="700" fill="#92400e">code-delivery</text>
  <text x="716" y="173" text-anchor="middle" font-size="11" fill="#475569">package &amp; ship — runs last</text>
  <text x="716" y="191" text-anchor="middle" font-size="10.5" fill="#64748b">commit / PR text, git ops;</text>
  <text x="716" y="207" text-anchor="middle" font-size="10.5" fill="#64748b">owns the commit/PR conventions</text>

  <!-- terminal PR -->
  <line x1="836" y1="172" x2="888" y2="172" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="888,172 879,167 879,177" fill="#64748b"/>
  <rect x="900" y="158" width="54" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="927" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">PR</text>

  <!-- code-delivery surfaces -->
  <text x="598" y="248" font-size="10.5" font-weight="600" fill="#64748b">code-delivery surfaces:</text>
  <text x="612" y="265" font-size="10.5" fill="#64748b">• Claude Code — direct edits + git operations</text>
  <text x="612" y="281" font-size="10.5" fill="#64748b">• Claude.ai — inline / zip packaging (claude-ai-packaging.md)</text>

  <!-- session-handoff (standalone) -->
  <rect x="34" y="330" width="300" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="184" y="362" text-anchor="middle" font-size="15.5" font-weight="700" fill="#166534">session-handoff</text>
  <text x="184" y="384" text-anchor="middle" font-size="11" fill="#475569">standalone — not in the pipeline</text>
  <text x="184" y="402" text-anchor="middle" font-size="10.5" fill="#64748b">cold-start handoff doc, end of session</text>

  <!-- divider -->
  <line x1="360" y1="328" x2="360" y2="432" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- trigger legend -->
  <text x="384" y="350" font-size="12" font-weight="700" fill="#0f172a">Which one fires?</text>
  <text x="384" y="373" font-size="10.8" fill="#475569">"clean this up" · "remove cruft" · "PR-ready"  →  code-polishing</text>
  <text x="384" y="392" font-size="10.8" fill="#475569">"add type hints" · "modernize this"  →  python- / cpp-code-review</text>
  <text x="384" y="411" font-size="10.8" fill="#475569">"fix this" · "implement X" · "open a PR"  →  code-delivery</text>
</svg>
