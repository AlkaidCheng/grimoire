<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">grimoire skills — workflow and relationships</title>
  <desc id="desc">Two layers. A standard governs how code is written: software-design for structure, and python-code-review / cpp-code-review for language, applied while authoring. A pipeline then readies existing code to ship: code-polishing (content cleanup), then the language review as a pass, then code-delivery (package and ship). The language reviews and software-design appear in both layers. session-handoff is a standalone skill.</desc>

  <rect x="0.5" y="0.5" width="999" height="539" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="500" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">grimoire skills — workflow &amp; relationships</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#64748b">A standard shapes how code is written; the pipeline cleans and ships it; session-handoff stands apart.</text>

  <!-- Standards band -->
  <rect x="28" y="84" width="944" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="105" font-size="11.5" font-weight="700" fill="#334155">The standard — how code gets written (applied while authoring, and on review)</text>

  <rect x="44" y="116" width="300" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="194" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">software-design</text>
  <text x="194" y="162" text-anchor="middle" font-size="10" fill="#64748b">structure &amp; design — decomposition, coupling</text>

  <rect x="360" y="116" width="286" height="62" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="503" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">python-code-review</text>
  <text x="503" y="162" text-anchor="middle" font-size="10" fill="#64748b">Python — style, types, idioms</text>

  <rect x="662" y="116" width="294" height="62" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="809" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">cpp-code-review</text>
  <text x="809" y="162" text-anchor="middle" font-size="10" fill="#64748b">C++ — modern C++, RAII, const</text>

  <!-- arrow down: standard informs authoring -->
  <line x1="500" y1="194" x2="500" y2="226" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="500,228 494,218 506,218" fill="#64748b"/>
  <text x="514" y="214" font-size="10" fill="#64748b">applied as you write</text>

  <!-- Pipeline -->
  <text x="44" y="250" font-size="11.5" font-weight="700" fill="#334155">The pipeline — clean up, review, then ship (passes over code that exists)</text>

  <rect x="44" y="260" width="206" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="147" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">code-polishing</text>
  <text x="147" y="306" text-anchor="middle" font-size="10" fill="#64748b">strip cruft, dead code</text>

  <line x1="250" y1="292" x2="296" y2="292" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="298,292 289,287 289,297" fill="#64748b"/>

  <rect x="300" y="260" width="250" height="64" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="425" y="287" text-anchor="middle" font-size="12.5" font-weight="700" fill="#155e75">python / cpp-code-review</text>
  <text x="425" y="306" text-anchor="middle" font-size="10" fill="#64748b">the language standard, as a review pass</text>

  <line x1="550" y1="292" x2="596" y2="292" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="598,292 589,287 589,297" fill="#64748b"/>

  <rect x="600" y="260" width="246" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="723" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">code-delivery</text>
  <text x="723" y="306" text-anchor="middle" font-size="10" fill="#64748b">package &amp; ship — last</text>

  <line x1="846" y1="292" x2="892" y2="292" stroke="#64748b" stroke-width="1.7"/>
  <polygon points="892,292 883,287 883,297" fill="#64748b"/>
  <rect x="900" y="278" width="54" height="28" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="927" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">PR</text>

  <text x="44" y="346" font-size="10.5" font-style="italic" fill="#475569">The language reviews (and software-design) sit in both rows — the standard you write to, and a pass over what's written.</text>

  <!-- session-handoff (standalone) -->
  <rect x="44" y="374" width="300" height="94" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="194" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">session-handoff</text>
  <text x="194" y="425" text-anchor="middle" font-size="10.5" fill="#475569">standalone — not in the pipeline</text>
  <text x="194" y="443" text-anchor="middle" font-size="10" fill="#64748b">cold-start handoff; low context or session end</text>

  <line x1="372" y1="374" x2="372" y2="468" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="396" y="395" font-size="11.5" font-weight="700" fill="#0f172a">Which one fires?</text>
  <text x="396" y="417" font-size="10.3" fill="#475569">writing / reviewing Python or C++  →  the language review</text>
  <text x="396" y="435" font-size="10.3" fill="#475569">"is this the right abstraction", "reduce complexity"  →  software-design</text>
  <text x="396" y="453" font-size="10.3" fill="#475569">"clean this up" → code-polishing;  "open a PR" → code-delivery</text>
</svg>
